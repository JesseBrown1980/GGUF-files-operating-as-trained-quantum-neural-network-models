name: Polariton stripes, the frozen stripe-phase prediction and its integer reader
on:
  pull_request:
    paths:
      - "polariton-stripes/**"
      - ".github/workflows/polariton-stripes.yml"
  push:
    paths:
      - "polariton-stripes/**"
      - ".github/workflows/polariton-stripes.yml"
permissions:
  contents: read
jobs:
  reader:
    name: Stage A (Rust) and stage B (Python on checked integer pairs), no float, the Fraction evidence compared, the sabotage suite and the independent check on synthetic streams; no engine runs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.81.0"
    steps:
      - name: Checkout, on a pull request its merge with the base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: The frozen files at their sums (PREDICTION-STRIPE-PHASE.hbp 3398b073..., README.md c0d9954d...)
        run: |
          set -euo pipefail
          cd polariton-stripes && sha256sum --strict -c SHA256SUMS
          test "$(sha256sum PREDICTION-STRIPE-PHASE.hbp | cut -d' ' -f1)" = "3398b0732077679d77e590399236cbc161d612bb06b82e77968e2541c83688a2"
      - name: Rust 1.81 and lints, python3; build and work folders outside the checkout
        run: |
          set -euo pipefail
          rustup toolchain install 1.81.0 --profile minimal --component clippy --component rustfmt
          python3 --version
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/stripes-target" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/stripes-work" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/stripes-work"
      - name: Stage A, format
        working-directory: polariton-stripes/reader/a
        run: cargo +1.81.0 fmt -- --check
      - name: Stage A, clippy -D warnings
        working-directory: polariton-stripes/reader/a
        run: cargo +1.81.0 clippy --locked --offline --release --all-targets -- -D warnings
      - name: Stage A, cargo test (the real-dump tests are ignored here; they need dumps at the excluded points)
        working-directory: polariton-stripes/reader/a
        run: |
          set -euo pipefail
          cargo +1.81.0 test --locked --offline --release
          cargo +1.81.0 build --locked --offline --release
          sha256sum "$CARGO_TARGET_DIR/release/stripes-read-a"
      - name: Stage B, the Python tests (integer pairs; the source scan refuses fractions, decimal, math, numpy, float(), round(), complex(), float literals and true division)
        run: python3 -I polariton-stripes/reader/b/run_tests.py
      - name: No float in the Rust or the Python (self-test first); the FLOAT-EVIDENCE.txt folder pins
        run: polariton-stripes/reader/check/no_float.sh
      - name: The Fraction stage B kept as evidence against the live integer pairs, on control data only, byte for byte
        run: |
          set -euo pipefail
          python3 -I polariton-stripes/reader/check/compare_b.py --work "$WORK/compare-b" | tee "$WORK/compare-b.txt"
          grep -q '^COMPARE_B_DONE|.*|result=equal|' "$WORK/compare-b.txt"
          test "$(grep -c '^COMPARE_B|.*|equal=1|' "$WORK/compare-b.txt")" = 4
      - name: Stage B end to end on a synthetic campaign, one VERDICT row per STRIPES_PREDICT row
        run: python3 -I polariton-stripes/reader/b/e2e.py --work "$WORK/e2e" --keep
      - name: The sabotage suite, every case CAUGHT
        run: |
          set -euo pipefail
          STRIPES_CAMPAIGN="$WORK/e2e/campaign" STRIPES_SABOTAGE_WORK="$WORK/sabotage" polariton-stripes/reader/sabotage/run.sh | tee "$WORK/sabotage.txt"
          test "$(grep -c '^CAUGHT ' "$WORK/sabotage.txt")" = 11
      - name: The independent check of stage A on synthetic streams only (check_a.py against stripes-read-a)
        run: |
          set -euo pipefail
          cd polariton-stripes/reader/a
          STRIPES_EMIT_DIR="$WORK/streams" cargo +1.81.0 test --locked --offline --release --test synthetic emit_streams_for_the_independent_check -- --ignored
          cd ../check
          python3 -I compare.py --ra "$CARGO_TARGET_DIR/release/stripes-read-a" --streams "$WORK/streams" --work "$WORK/compare" | tee "$WORK/compare.txt"
          grep -q '|equal_all=true|' "$WORK/compare.txt"
      - name: No engine was built or run (twens and polariton_first_correction are not in this job)
        run: |
          set -euo pipefail
          test -z "$(find "$CARGO_TARGET_DIR" -type f \( -name twens -o -name polariton_first_correction \) -print -quit)"
