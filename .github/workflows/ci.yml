name: ci
on: [push, pull_request]
jobs:
  rust-181:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.81 with clippy
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.81.0
      - name: no float, no json, no node
        run: |
          ! grep -rnE '\bf(32|64)\b' src tests
          ! git ls-files | grep -iE '\.(json|js|mjs|ts)$|package\.json'
      - name: clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: star inputs
        run: sha256sum -c data/stars/SHA256SUMS
      - name: tests
        run: cargo test --release
      - name: training reproduces the committed models and receipts
        run: |
          cargo run --release -- train data/stars out 3 4
          cd out && sha256sum -c ../results/SHA256SUMS
      - name: every committed GGUF model reproduces its header
        run: cargo run --release -- verify results | tee verify.txt && ! grep -q 'matches_header=0' verify.txt
