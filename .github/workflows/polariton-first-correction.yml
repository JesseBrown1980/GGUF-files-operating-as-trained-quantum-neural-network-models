name: First correction of the polariton test
on:
  pull_request:
    branches: [main]
    paths:
      - "src/bin/polariton_first_correction.rs"
      - "polariton-first-correction/**"
      - ".github/workflows/polariton-first-correction.yml"
      - "polariton/PREDICTION.hbp"
      - "polariton/RECEIPT.hbp"
      - "polariton/second-seat/recheck-ce44be7/contact/chebdrv.py"
      - "polariton/second-seat/recheck-ce44be7/contact/cheb/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches: [main]
    paths:
      - "src/bin/polariton_first_correction.rs"
      - "polariton-first-correction/**"
      - ".github/workflows/polariton-first-correction.yml"
      - "polariton/PREDICTION.hbp"
      - "polariton/RECEIPT.hbp"
      - "polariton/second-seat/recheck-ce44be7/contact/chebdrv.py"
      - "polariton/second-seat/recheck-ce44be7/contact/cheb/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
permissions:
  contents: read
jobs:
  first-correction:
    name: The certified integrator, its baseline, its controls, and the frozen grid when it is filed
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - name: Checkout, on a pull request its merge with the base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust 1.81 and lints
        run: rustup toolchain install 1.81.0 --profile minimal --component clippy --component rustfmt
      - name: Format, Clippy, build
        run: |
          set -euo pipefail
          cargo +1.81.0 fmt --all -- --check
          cargo +1.81.0 clippy --locked --offline --bin polariton_first_correction -- -D warnings
          cargo +1.81.0 build --release --locked --offline --bin polariton_first_correction
      - name: The frozen row, and this stage's files, at their pins
        run: |
          set -euo pipefail
          test "$(sed -n 48p polariton/PREDICTION.hbp | sha256sum | cut -d' ' -f1)" = "3b1e0477a98624b619d12f82775666d88f8d2c14671b453a1198bedd9d50d549"
          sed -n 48p polariton/PREDICTION.hbp | grep -q '^POLARITON_FIRST_CORRECTION|'
          grep -q 'row_sha256=3b1e0477a98624b619d12f82775666d88f8d2c14671b453a1198bedd9d50d549' polariton-first-correction/PLAN.hbp
          cd polariton-first-correction
          sha256sum --strict -c --quiet SHA256SUMS
          cd reviews/opus55-source-2d77636
          sha256sum --strict -c --quiet SHA256SUMS
      - name: The route builds the Hamiltonian in the full Fock space and meets the engine's rows, parity, bandwidth and interval
        run: python3 -I -X utf8 polariton-first-correction/route_first_correction.py rows target/release/polariton_first_correction
      - name: Reads at multiples of the window reproduce RECEIPT-DYADIC.hbp at two allowed points, and an off-grid time is refused
        run: |
          set -euo pipefail
          E=target/release/polariton_first_correction
          { $E point 100 40 1/2 1/20 6 1/64,1/2,33/64,3/2; $E point 243 243 -1/4 1/9 6 1/64,1/4,7/8,317/64; } > dyadic.hbp
          cmp dyadic.hbp polariton-first-correction/RECEIPT-DYADIC.hbp
          rc=0
          $E point 100 40 1/2 1/20 6 1/2,1/3 > off-grid.hbp 2> off-grid.err || rc=$?
          test "$rc" = 2
          test ! -s off-grid.hbp
      - name: The baseline reproduces byte for byte at its 40 runs outside the bridge's reserved points, and its read is the one on file
        run: |
          set -euo pipefail
          D=polariton-first-correction
          # The two baseline runs at N = 729, y = 2/27 (delta = 0, 1/2) sit in the bridge's reserved set (polariton-bridge/PREDICTION.hbp,
          # BRIDGE_RESERVED); they stay unrun here until the operator's word. The other 40 runs print 58 of the receipt's 64 rows.
          grep -v -E '^FC_RUN\|stage=baseline\|.*\|N=729\|K=729\|delta=(0|1/2)\|y=2/27\|' $D/PLAN.hbp > plan-allowed.hbp
          python3 -I -X utf8 $D/run_stage.py target/release/polariton_first_correction plan-allowed.hbp baseline baseline.hbp baseline-cost.hbp 4
          cat baseline-cost.hbp
          grep -v -E '\|N=729\|K=729\|.*\|y=2/27\|delta=(0|1/2)\|' $D/RECEIPT-BASELINE.hbp | sed -e '1s/runs=42/runs=40/' -e '$s/runs=42/runs=40/' > receipt-allowed.hbp
          cmp baseline.hbp receipt-allowed.hbp
          python3 -I -X utf8 $D/read_first_correction.py baseline polariton/PREDICTION.hbp $D/PLAN.hbp $D/RECEIPT-BASELINE.hbp polariton/RECEIPT.hbp > read-baseline.hbp
          cmp read-baseline.hbp $D/READ-BASELINE.hbp
      - name: The route's big-integer Bessel series meet the engine's tables on the baseline's 40 allowed runs
        run: python3 -I -X utf8 polariton-first-correction/route_first_correction.py bessel target/release/polariton_first_correction receipt-allowed.hbp
      - name: The reader's grid mode, on synthetic receipts built from the closed forms, reads each scenario as the row asks. No engine and no model run in this step
        run: python3 -I -X utf8 polariton-first-correction/synthetic/synth_reader.py polariton-first-correction/read_first_correction.py "$RUNNER_TEMP/synth"
      - name: The real engine passes the controls' checks, and each sabotage fails a named one
        run: |
          set -euo pipefail
          D=polariton-first-correction
          E=target/release/polariton_first_correction
          python3 -I -X utf8 $D/run_stage.py $E $D/PLAN.hbp control real.hbp real-cost.hbp 4
          python3 -I -X utf8 $D/read_first_correction.py control polariton/RECEIPT.hbp real.hbp > /dev/null
          for name in leak_understated bessel_short norm_drift drop_even_root; do
            python3 -I -X utf8 $D/run_stage.py $E $D/PLAN.hbp control sab.hbp sab-cost.hbp 4 sabotage=$name
            rc=0
            python3 -I -X utf8 $D/read_first_correction.py control polariton/RECEIPT.hbp sab.hbp > sab-read.hbp || rc=$?
            test "$rc" = 1
            grep -E '^FC_READ_DONE' sab-read.hbp
            cmp <(grep -E '^FC_READ_DONE' sab-read.hbp) <(grep -E "^FC_CONTROL_EXPECT\|sabotage=$name\|" $D/CONTROLS.hbp | cut -d'|' -f3-)
          done
      - name: The second seat's propagator meets the engine on the baseline's rows and on the crosscheck rows, and the certificate is walked on small blocks, before the grid
        run: |
          set -euo pipefail
          D=polariton-first-correction
          E=target/release/polariton_first_correction
          python3 -I -X utf8 $D/run_stage.py $E $D/PLAN.hbp crosscheck crosscheck.hbp crosscheck-cost.hbp 4
          cat real.hbp crosscheck.hbp > real-and-crosscheck.hbp
          python3 -I -X utf8 $D/read_first_correction.py control polariton/RECEIPT.hbp real-and-crosscheck.hbp > /dev/null
          CARGO_TARGET_DIR="$RUNNER_TEMP/cheb" cargo +1.81.0 build --release --manifest-path polariton/second-seat/recheck-ce44be7/contact/cheb/Cargo.toml
          mkdir -p "$RUNNER_TEMP/tables"
          python3 -I -X utf8 $D/route_first_correction.py integrator polariton/second-seat/recheck-ce44be7/contact "$RUNNER_TEMP/cheb/release/cheb" "$RUNNER_TEMP/tables" receipt-allowed.hbp 4
          python3 -I -X utf8 $D/route_first_correction.py integrator polariton/second-seat/recheck-ce44be7/contact "$RUNNER_TEMP/cheb/release/cheb" "$RUNNER_TEMP/tables" crosscheck.hbp 4
          python3 -I -X utf8 $D/route_first_correction.py certificate $E
      - name: The frozen grid, once filed, reproduces byte for byte, reads as on file, and meets the second seat's propagator
        run: |
          set -euo pipefail
          D=polariton-first-correction
          if [ ! -f $D/RECEIPT-GRID.hbp ]; then
            echo "FC_GRID|not_filed_at_this_head|json=0"
            exit 0
          fi
          E=target/release/polariton_first_correction
          python3 -I -X utf8 $D/run_stage.py $E $D/PLAN.hbp grid grid.hbp grid-cost.hbp 4
          cat grid-cost.hbp
          cmp grid.hbp $D/RECEIPT-GRID.hbp
          python3 -I -X utf8 $D/read_first_correction.py grid polariton/PREDICTION.hbp $D/PLAN.hbp $D/RECEIPT-BASELINE.hbp grid.hbp > read-grid.hbp
          cmp read-grid.hbp $D/READ-GRID.hbp
          python3 -I -X utf8 $D/route_first_correction.py bessel $E grid.hbp
          CARGO_TARGET_DIR="$RUNNER_TEMP/cheb" cargo +1.81.0 build --release --manifest-path polariton/second-seat/recheck-ce44be7/contact/cheb/Cargo.toml
          mkdir -p "$RUNNER_TEMP/tables"
          python3 -I -X utf8 $D/route_first_correction.py integrator polariton/second-seat/recheck-ce44be7/contact "$RUNNER_TEMP/cheb/release/cheb" "$RUNNER_TEMP/tables" grid.hbp 4
      - name: The streaming layout reproduces the grid and the baseline's 40 runs outside the bridge's reserved points, every field but array_bytes
        run: |
          set -euo pipefail
          D=polariton-first-correction
          printf '#!/usr/bin/env bash\nshift\nexec "%s" stream "$@"\n' "$PWD/target/release/polariton_first_correction" > stream-engine.sh
          chmod +x stream-engine.sh
          strip() { sed -E 's/\|array_bytes=[0-9]+\|/|array_bytes=X|/' "$1"; }
          python3 -I -X utf8 $D/run_stage.py ./stream-engine.sh $D/PLAN.hbp grid grid-stream.hbp grid-stream-cost.hbp 4
          cat grid-stream-cost.hbp
          cmp <(strip grid-stream.hbp) <(strip $D/RECEIPT-GRID.hbp)
          # The two baseline runs at N = 729, y = 2/27 (delta = 0, 1/2) sit in the bridge's reserved set and stay unrun here.
          grep -v -E '^FC_RUN\|stage=baseline\|.*\|N=729\|K=729\|delta=(0|1/2)\|y=2/27\|' $D/PLAN.hbp > plan-allowed-stream.hbp
          python3 -I -X utf8 $D/run_stage.py ./stream-engine.sh plan-allowed-stream.hbp baseline baseline-stream.hbp baseline-stream-cost.hbp 4
          cat baseline-stream-cost.hbp
          grep -v -E '\|N=729\|K=729\|.*\|y=2/27\|delta=(0|1/2)\|' $D/RECEIPT-BASELINE.hbp | sed -e '1s/runs=42/runs=40/' -e '$s/runs=42/runs=40/' > receipt-allowed-stream.hbp
          cmp <(strip baseline-stream.hbp) <(strip receipt-allowed-stream.hbp)
          # Many tiles and many sweeps, as the full space at N = 6561 takes them (7 tiles of 512 rows): the baseline's 8 runs at
          # N = 729, K = 128 and 192 at tile = depth = 8 and at tile = depth = 3, every field but array_bytes as filed.
          grep -E '^FC_RUN\|stage=baseline\|group=sweep\|N=729\|K=(128|192)\|' $D/PLAN.hbp > plan-small.hbp
          grep -E '^POLARITON_FIRST_CORRECTION_READ\|N=729\|K=(128|192)\|' $D/RECEIPT-BASELINE.hbp > receipt-small.hbp
          for opts in "depth=8 tile=8" "depth=3 tile=3"; do
            printf '#!/usr/bin/env bash\nshift\nexec "%s" stream "$@" %s\n' "$PWD/target/release/polariton_first_correction" "$opts" > stream-small.sh
            chmod +x stream-small.sh
            python3 -I -X utf8 $D/run_stage.py ./stream-small.sh plan-small.hbp baseline small.hbp small-cost.hbp 4
            grep -E '^POLARITON_FIRST_CORRECTION_READ' small.hbp > small-rows.hbp
            cmp <(strip small-rows.hbp) <(strip receipt-small.hbp)
          done
          # The dyadic reads of RECEIPT-DYADIC.hbp in the streaming layout.
          { ./stream-engine.sh point 100 40 1/2 1/20 6 1/64,1/2,33/64,3/2; ./stream-engine.sh point 243 243 -1/4 1/9 6 1/64,1/4,7/8,317/64; } > dyadic-stream.hbp
          cmp <(strip dyadic-stream.hbp) <(strip $D/RECEIPT-DYADIC.hbp)
